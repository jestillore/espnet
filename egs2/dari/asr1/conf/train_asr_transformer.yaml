# Batching strategy
batch_type: numel
batch_bins: 2000000         # Use GPU memory well (~2M features)
accum_grad: 2               # Effective batch size ×2

# Training loop
max_epoch: 100              # Longer training for larger dataset
patience: 10                # More room for improvements

# Model architecture
encoder: transformer
encoder_conf:
    output_size: 512
    attention_heads: 8
    linear_units: 2048
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.0
    input_layer: conv2d
    normalize_before: true

decoder: transformer
decoder_conf:
    attention_heads: 8
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.0
    src_attention_dropout_rate: 0.0

# Loss
model_conf:
    ctc_weight: 0.3
    lsm_weight: 0.1
    length_normalized_loss: false

# Optimizer
optim: adam
optim_conf:
    lr: 0.002
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 5000        # Higher for more data

# SpecAug
specaug: specaug
specaug_conf:
    apply_time_warp: false
    apply_freq_mask: true
    freq_mask_width_range: [0, 30]
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_range: [0, 40]
    num_time_mask: 2

# Mixed precision
use_amp: true

# Best model selection
best_model_criterion:
  - [valid, acc, max]
keep_nbest_models: 10

# DDP
ngpu: 8
num_workers: 4

# Enable DistributedDataParallel
use_ddp: true
